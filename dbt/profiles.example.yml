# For local development only: copy to ~/.dbt/profiles.yml.
# Inside the Databricks job, the dbt task builds the profile from the job's
# warehouse_id / catalog / schema, so this file is not used there.
healthcare_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "/sql/1.0/warehouses/{{ env_var('DATABRICKS_WAREHOUSE_ID') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('HC_CATALOG', 'hc_dev') }}"
      schema: silver
      threads: 8
