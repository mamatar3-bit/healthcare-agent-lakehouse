[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks use injected globals (spark, dbutils) and imports after %pip cells
"src/0*.py" = ["F821", "E402", "I001"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
