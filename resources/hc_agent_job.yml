# End-to-end orchestration as a Lakeflow (Databricks) Job:
#
#   setup -> generate_bronze -> dbt_build -> uc_functions -> sql_objects -> run_procedures ┐
#        \                            \-> genie_check ─────────────────────────────────────┤
#         \-> docs_index ────────────────────────────────────────────────────────────────────┴-> log_and_evaluate
#                                                                                                   |
#                                       eval_gate (condition: eval_passed == true) -> deploy_agent -> smoke_test
#
# A second job refreshes data and the document index on a schedule.

resources:
  jobs:
    hc_agent_end_to_end:
      name: hc_agent_end_to_end_${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: healthcare-agent-lakehouse
        env: ${bundle.target}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: embedding_endpoint
          default: ${var.embedding_endpoint}
        - name: vector_search_endpoint
          default: ${var.vector_search_endpoint}
        - name: genie_space_id
          default: ${var.genie_space_id}
        - name: serving_endpoint_name
          default: ${var.serving_endpoint_name}
        - name: eval_pass_threshold
          default: ${var.eval_pass_threshold}
        - name: env
          default: ${bundle.target}

      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.10.0,<2.0.0

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup.py

        - task_key: generate_bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../src/01_generate_bronze.py

        - task_key: dbt_build
          depends_on: [{ task_key: generate_bronze }]
          environment_key: dbt_env
          dbt_task:
            project_directory: ../dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: silver
            commands:
              - "dbt deps"
              - "dbt seed --full-refresh"
              - "dbt run"
              - "dbt test"

        - task_key: uc_functions
          depends_on: [{ task_key: dbt_build }]
          notebook_task:
            notebook_path: ../src/02_create_uc_functions.py

        - task_key: sql_objects
          depends_on: [{ task_key: uc_functions }]
          notebook_task:
            notebook_path: ../src/08_run_sql.py
            base_parameters:
              sql_files: "01_ops_tables.sql,02_functions.sql,03_procedures.sql"

        - task_key: run_procedures
          depends_on: [{ task_key: sql_objects }]
          notebook_task:
            notebook_path: ../src/08_run_sql.py
            base_parameters:
              sql_files: "04_run_daily_procedures.sql"

        - task_key: docs_index
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../src/03_build_vector_index.py

        - task_key: genie_check
          depends_on: [{ task_key: dbt_build }]
          notebook_task:
            notebook_path: ../src/04_genie_space.py

        - task_key: log_and_evaluate
          depends_on:
            - { task_key: run_procedures }
            - { task_key: docs_index }
            - { task_key: genie_check }
          notebook_task:
            notebook_path: ../src/05_log_and_evaluate_agent.py

        - task_key: eval_gate
          depends_on: [{ task_key: log_and_evaluate }]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.log_and_evaluate.values.eval_passed}}"
            right: "true"

        - task_key: deploy_agent
          depends_on:
            - task_key: eval_gate
              outcome: "true"
          notebook_task:
            notebook_path: ../src/06_deploy_agent.py

        - task_key: smoke_test
          depends_on: [{ task_key: deploy_agent }]
          notebook_task:
            notebook_path: ../src/07_smoke_test_endpoint.py

    hc_daily_refresh:
      name: hc_daily_refresh_${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: healthcare-agent-lakehouse
        env: ${bundle.target}
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"
        timezone_id: America/New_York
        # development mode pauses this automatically
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: embedding_endpoint
          default: ${var.embedding_endpoint}
        - name: vector_search_endpoint
          default: ${var.vector_search_endpoint}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: incremental
          default: "true"
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.10.0,<2.0.0
      tasks:
        - task_key: generate_bronze
          notebook_task:
            notebook_path: ../src/01_generate_bronze.py
        - task_key: dbt_build
          depends_on: [{ task_key: generate_bronze }]
          environment_key: dbt_env
          dbt_task:
            project_directory: ../dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: silver
            commands:
              - "dbt deps"
              - "dbt build"
        - task_key: run_procedures
          depends_on: [{ task_key: dbt_build }]
          notebook_task:
            notebook_path: ../src/08_run_sql.py
            base_parameters:
              sql_files: "04_run_daily_procedures.sql"
        - task_key: docs_index
          notebook_task:
            notebook_path: ../src/03_build_vector_index.py
